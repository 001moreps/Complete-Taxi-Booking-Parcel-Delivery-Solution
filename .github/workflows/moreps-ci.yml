name: MoRepS CI
on:
  push:
    branches: [moreps-production-build]
  pull_request:
    branches: [moreps-production-build]
jobs:
  customer-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm install --legacy-peer-deps
      - run: npm run build
  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install
      - run: npm run build
